openapi: 3.1.0
info:
  title: Parimit API
  version: 0.1.0-alpha.3
  summary: Proposal-only payment governance, human review, and signed evidence envelopes
  description: |
    Parimit accepts payment proposals, evaluates deterministic policy,
    records human decisions, produces signed evidence-only authorization
    envelopes, and supports mock observations. It has no live payment connector
    and cannot move money.

    External pilots use signed OIDC bearer tokens and map an immutable subject
    to exactly one of `agent`, `approver`, `consumer`, or `admin`. The
    `x-parimit-actor`/`x-parimit-role` alternative is restricted to an explicit
    loopback demo and is not production authentication.
    `AUTHORIZED_NO_DISPATCH` means an exact proposal received the required
    approvals; it never means paid.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8787
    description: Local safe demo
security:
  - OidcBearer: []
  - DemoActor: []
    DemoRole: []
tags:
  - name: Safety
  - name: Proposals
  - name: Human review
  - name: Audit
  - name: Evidence envelopes
  - name: Mock simulation
paths:
  /.well-known/jwks.json:
    get:
      security: []
      tags: [Evidence envelopes]
      operationId: getEvidenceEnvelopeKeys
      summary: Return public Ed25519 verification keys
      description: Never contains private key material.
      responses:
        "200":
          description: JSON Web Key Set for evidence-envelope verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeJwks"
  /v1/safety:
    get:
      security: []
      tags: [Safety]
      operationId: getSafetyMetadata
      summary: Describe the enforced proposal-only boundary
      responses:
        "200":
          description: Safety metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyResponse"
  /v1/identity:
    get:
      tags: [Safety]
      operationId: getAuthenticatedIdentity
      summary: Return the authenticated actor identifier and Parimit role
      description: >-
        OIDC actor identifiers are deterministic, non-PII hashes derived from
        the configured issuer and immutable subject. Agents use `actor_id` as
        `requested_by.id` when creating or simulating a proposal.
      responses:
        "200":
          description: Authenticated Parimit identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/intents:
    post:
      tags: [Proposals]
      operationId: createPaymentProposal
      summary: Create or idempotently replay a payment proposal
      description: >-
        Agent-only. `requested_by.id` must equal the authenticated actor ID.
        Proposes an intent and evaluates policy; it does not execute a payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProposalInput"
            examples:
              ordinaryDemo:
                value:
                  idempotency_key: demo-agent-2026-09-19-001
                  requested_by:
                    type: agent
                    id: open-source-demo-agent
                  on_behalf_of: demo-user
                  amount:
                    currency: INR
                    minor: "49900"
                  payee_reference: demo-book-shop
                  purpose: Synthetic order DEMO-1042
                  expires_in_seconds: 1800
      responses:
        "201":
          description: New proposal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentResponse"
        "200":
          description: Idempotent replay of an existing identical proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
    get:
      tags: [Proposals]
      operationId: listPaymentProposals
      summary: List proposals
      description: Agents receive only their own proposals. Approvers and admins may list all proposals.
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IntentStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Matching proposals, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Intent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/intents/simulate:
    post:
      tags: [Mock simulation]
      operationId: simulateProposalPolicy
      summary: Evaluate policy without persisting a proposal
      description: >-
        Agent-only. `requested_by.id` must equal the authenticated actor ID.
        This is a dry-run policy evaluation and never contacts a rail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProposalInput"
      responses:
        "200":
          description: Non-persisted policy result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [policy, persisted, moves_money]
                    properties:
                      policy:
                        $ref: "#/components/schemas/PolicyDecision"
                      persisted:
                        const: false
                      moves_money:
                        const: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/intents/{intentId}:
    parameters:
      - $ref: "#/components/parameters/IntentId"
    get:
      tags: [Proposals]
      operationId: getPaymentProposal
      summary: Get a proposal and its current demo state
      description: Agents can read only their own proposals. Approvers and admins may read all proposals.
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/intents/{intentId}/cancel:
    parameters:
      - $ref: "#/components/parameters/IntentId"
    post:
      tags: [Proposals]
      operationId: cancelPaymentProposal
      summary: Cancel an eligible proposal
      description: An agent may cancel only its own awaiting proposal; an admin may cancel an eligible proposal.
      security:
        - OidcBearer: []
        - DemoActor: []
          DemoRole: []
      responses:
        "200":
          description: Cancelled proposal; loopback demo responses also include a warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentResponseWithWarning"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/intents/{intentId}/approvals:
    parameters:
      - $ref: "#/components/parameters/IntentId"
    post:
      tags: [Human review]
      operationId: recordHumanDecision
      summary: Record a human approval or rejection
      description: |
        `approver` or `admin` only. OIDC is required for a shared pilot; demo
        headers remain loopback-only. An approval cannot dispatch or execute a
        payment.
      security:
        - OidcBearer: []
        - DemoActor: []
          DemoRole: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
      responses:
        "200":
          description: Updated proposal; loopback demo responses also include a warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentResponseWithWarning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/intents/{intentId}/evidence-envelopes:
    parameters:
      - $ref: "#/components/parameters/IntentId"
    post:
      tags: [Evidence envelopes]
      operationId: issueEvidenceEnvelope
      summary: Issue signed, non-dispatchable approval evidence
      description: |
        `approver` or `admin` only. Requires a tenant-bound v3 proposal in
        `AUTHORIZED_NO_DISPATCH` state. The compact EdDSA JWS is evidence of
        review only: its signed capability fields explicitly prohibit payment
        dispatch, provider instructions, execution authority, and value movement.
        Only one envelope may exist for an intent state and audience. Expiry
        requires a fresh proposal and human review; it is not renewed in place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceEnvelopeIssueInput"
      responses:
        "201":
          description: New evidence envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelopeResponse"
        "200":
          description: Byte-identical idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelopeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/evidence-envelopes/verify:
    post:
      tags: [Evidence envelopes]
      operationId: verifyEvidenceEnvelope
      summary: Verify signature, schema, time, audience, issuance, and intent binding
      description: >-
        Read-only. Verification does not consume the envelope and therefore is
        not replay prevention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceEnvelopePresentation"
      responses:
        "200":
          description: Verification report; invalid artifacts also return 200 with `valid:false`
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/EvidenceEnvelopeVerification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/evidence-envelopes/consume:
    post:
      tags: [Evidence envelopes]
      operationId: consumeEvidenceEnvelope
      summary: Atomically record one-time acceptance of an evidence envelope
      description: |
        `consumer` or `admin` only. This records evidence consumption and an
        audit event; it does not send, execute, settle, or otherwise move money.
        Replay protection is authoritative only within this configured Parimit
        persistence boundary. Offline recipients need their own durable ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceEnvelopeConsumeInput"
      responses:
        "200":
          description: Consumed envelope state or same-consumer idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEnvelopeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/intents/{intentId}/audit:
    parameters:
      - $ref: "#/components/parameters/IntentId"
    get:
      tags: [Audit]
      operationId: getProposalAuditEvents
      summary: Get the hash-chained audit history
      description: Agents can read only their own proposal audit; approvers and admins may read all.
      responses:
        "200":
          description: Audit events in sequence order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/intents/{intentId}/audit/verify:
    parameters:
      - $ref: "#/components/parameters/IntentId"
    get:
      tags: [Audit]
      operationId: verifyProposalIntegrity
      summary: Verify proposal, approval, and audit integrity
      description: Agents can verify only their own proposals; approvers and admins may verify all.
      responses:
        "200":
          description: Integrity report
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/IntegrityReport"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
  /v1/demo/intents/{intentId}/observations:
    parameters:
      - $ref: "#/components/parameters/IntentId"
    post:
      tags: [Mock simulation]
      operationId: recordMockObservation
      summary: Record a demo-only mock outcome
      description: >-
        Admin-only. Available only after the proposal reaches
        `AUTHORIZED_NO_DISPATCH`. No
        funds move. Once `IN_DOUBT` is recorded, every later mock observation is
        rejected with HTTP 409 and error code `IN_DOUBT_FROZEN`; this alpha has
        no authorized reconciliation mechanism.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/ObservationStatus"
                provider_reference:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Fictional reference for demos only.
      responses:
        "200":
          description: Updated proposal and explicit mock warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentResponseWithWarning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/IntegrityError"
        "503":
          $ref: "#/components/responses/IdentityProviderUnavailable"
components:
  securitySchemes:
    OidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Signed OIDC access token validated against the configured issuer,
        audience, algorithm allowlist, expiration, and remote JWKS.
    DemoActor:
      type: apiKey
      in: header
      name: x-parimit-actor
      description: Spoofable demo actor identifier; not production authentication.
    DemoRole:
      type: apiKey
      in: header
      name: x-parimit-role
      description: Spoofable demo role (`agent`, `approver`, `consumer`, or `admin`).
  parameters:
    IntentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid JSON, input, or policy data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AuthenticationRequired:
      description: A bearer token or explicit loopback-demo identity is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated actor lacks the required role or ownership
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Proposal was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency conflict, duplicate reviewer, invalid state transition, or frozen `IN_DOUBT` observation stream
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: JSON request body exceeds the 1 MiB limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IntegrityError:
      description: Stored proposal integrity verification failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal persistence or integrity failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdentityProviderUnavailable:
      description: Configured OIDC signing keys are temporarily unavailable or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CanonicalTimestamp:
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
      description: Exact UTC millisecond timestamp emitted by JavaScript Date.toISOString().
    IdentityResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [actor_id, actor_role, authentication_method]
          properties:
            actor_id:
              type: string
              minLength: 1
              maxLength: 128
            actor_role:
              type: string
              enum: [agent, approver, consumer, admin]
            authentication_method:
              type: string
              enum: [oidc, local_demo_headers]
            issuer:
              type: string
              format: uri
        warning:
          type: string
          description: Present only when spoofable loopback demo headers authenticated the request.
    PaymentProposalInput:
      type: object
      additionalProperties: false
      required: [idempotency_key, requested_by, amount, payee_reference, purpose]
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+\\-]*$"
        requested_by:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type:
              const: agent
            id:
              type: string
              minLength: 1
              maxLength: 128
              pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+\\-]*$"
        on_behalf_of:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+\\-]*$"
        amount:
          type: object
          additionalProperties: false
          required: [currency, minor]
          properties:
            currency:
              const: INR
            minor:
              type: string
              pattern: "^[1-9][0-9]*$"
              description: Positive integer paise encoded as a decimal string.
        payee_reference:
          type: string
          minLength: 6
          maxLength: 64
          pattern: "^[A-Za-z][A-Za-z0-9:_-]{5,63}$"
          description: Opaque internal alias only; payment addresses and account identifiers are forbidden.
        purpose:
          type: string
          minLength: 1
          maxLength: 500
        expires_in_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 1800
    IntentStatus:
      type: string
      enum:
        - POLICY_DENIED
        - AWAITING_APPROVAL
        - AUTHORIZED_NO_DISPATCH
        - REJECTED
        - CANCELLED
        - EXPIRED
    ObservationStatus:
      type: string
      enum: [UNKNOWN, PENDING, SUCCEEDED, FAILED, REVERSED, DISPUTED, IN_DOUBT]
      description: >-
        `IN_DOUBT` freezes this proposal's mock observation stream; no later
        observation is accepted in the alpha.
    PolicyDecision:
      type: object
      required:
        - allowed
        - reasons
        - rules_version
        - config_digest
        - required_approvals
        - current_daily_exposure_minor
        - projected_daily_exposure_minor
      properties:
        allowed:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        rules_version:
          type: string
        config_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the canonical deployment policy configuration.
        required_approvals:
          type: integer
          enum: [1, 2]
        current_daily_exposure_minor:
          type: string
          pattern: "^[0-9]+$"
        projected_daily_exposure_minor:
          type: string
          pattern: "^[0-9]+$"
    Approval:
      type: object
      required: [actor_id, actor_role, decision, intent_hash, created_at, receipt_hmac]
      properties:
        actor_id:
          type: string
        actor_role:
          type: string
          enum: [approver, admin]
        decision:
          type: string
          enum: [APPROVE, REJECT]
        intent_hash:
          type: string
        created_at:
          $ref: "#/components/schemas/CanonicalTimestamp"
        receipt_hmac:
          type: string
    ApprovalReceipt:
      type: object
      description: Audit evidence only. It cannot authorize or dispatch execution.
      required: [version, intent_id, intent_hash, fully_approved_at, approvals, execution_authorized, notice]
      properties:
        version:
          const: parimit-approval-receipt-v1
        intent_id:
          type: string
        intent_hash:
          type: string
        fully_approved_at:
          $ref: "#/components/schemas/CanonicalTimestamp"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        execution_authorized:
          const: false
        notice:
          type: string
    Observation:
      type: object
      required: [status, observed_at, source, retry_permitted]
      properties:
        status:
          $ref: "#/components/schemas/ObservationStatus"
        provider_reference:
          type: string
          minLength: 1
          maxLength: 200
        observed_at:
          $ref: "#/components/schemas/CanonicalTimestamp"
        source:
          const: DEMO_MOCK
        retry_permitted:
          const: false
    Intent:
      type: object
      required:
        - id
        - intent_version
        - tenant_id
        - state_version
        - initial_status
        - idempotency_key
        - requested_by
        - amount
        - payee_reference
        - purpose
        - status
        - required_approvals
        - approval_count
        - policy
        - intent_hash
        - created_at
        - expires_at
        - approvals
      properties:
        id:
          type: string
          format: uuid
        intent_version:
          type: string
          enum: [parimit-payment-intent-v1, parimit-payment-intent-v2, parimit-payment-intent-v3]
          description: >-
            Version of the canonical payload covered by intent_hash. New intents use v3,
            which adds tenant binding.
            Migrated v1 rows are archival/read-only, and v1 authorization state is rejected
            because its digest did not bind the policy threshold.
        tenant_id:
          type: string
          description: Deployment-trusted tenant identifier covered by the v3 intent digest.
        state_version:
          type: integer
          minimum: 1
          description: Monotonic authorization-state revision; mock observations do not increment it.
        initial_status:
          type: string
          enum: [POLICY_DENIED, AWAITING_APPROVAL]
          description: Immutable creation state covered by the v2/v3 intent digest.
        idempotency_key:
          type: string
        requested_by:
          type: object
          required: [type, id]
          properties:
            type:
              const: agent
            id:
              type: string
        on_behalf_of:
          type: string
        amount:
          type: object
          required: [currency, minor]
          properties:
            currency:
              const: INR
            minor:
              type: string
        payee_reference:
          type: string
        purpose:
          type: string
        status:
          $ref: "#/components/schemas/IntentStatus"
        required_approvals:
          type: integer
          enum: [1, 2]
        approval_count:
          type: integer
          minimum: 0
        policy:
          type: object
          required: [allowed, reasons, rules_version]
          properties:
            allowed:
              type: boolean
            reasons:
              type: array
              items:
                type: string
            rules_version:
              type: string
            config_digest:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: Present and integrity-bound on v3 intents.
        intent_hash:
          type: string
        created_at:
          $ref: "#/components/schemas/CanonicalTimestamp"
        expires_at:
          $ref: "#/components/schemas/CanonicalTimestamp"
        observation:
          $ref: "#/components/schemas/Observation"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        receipt:
          $ref: "#/components/schemas/ApprovalReceipt"
        idempotent_replay:
          type: boolean
    EvidenceEnvelopeIssueInput:
      type: object
      additionalProperties: false
      required: [audience, idempotency_key]
      properties:
        audience:
          type: string
          format: uri
          description: Exact relying-party trust URI allowlisted by the deployment.
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+\\-]*$"
        expires_in_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: Cannot exceed the deployment maximum or the proposal deadline.
    EvidenceEnvelopePresentation:
      type: object
      additionalProperties: false
      required: [compact_jws, audience]
      properties:
        compact_jws:
          type: string
          minLength: 1
          maxLength: 65536
        audience:
          type: string
          format: uri
    EvidenceEnvelopeConsumeInput:
      type: object
      additionalProperties: false
      required: [compact_jws, audience, idempotency_key]
      properties:
        compact_jws:
          type: string
          minLength: 1
          maxLength: 65536
        audience:
          type: string
          format: uri
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+\\-]*$"
    AuthorizationEnvelopeClaims:
      type: object
      additionalProperties: false
      required:
        - version
        - iss
        - sub
        - aud
        - jti
        - iat
        - nbf
        - exp
        - issued_at
        - tenant_id
        - identity_assurance
        - intent
        - policy_digest
        - decision
        - replay
        - source_audit
        - capability
        - notice
      properties:
        version:
          const: parimit-authorization-envelope-v1
        iss:
          type: string
          format: uri
        sub:
          type: string
          pattern: "^urn:parimit:intent:"
        aud:
          type: string
          format: uri
        jti:
          type: string
          format: uuid
        iat:
          type: integer
        nbf:
          type: integer
        exp:
          type: integer
        issued_at:
          $ref: "#/components/schemas/CanonicalTimestamp"
          description: >-
            Exact millisecond issuance timestamp. Integer `iat` and `nbf` name
            its containing UTC second; use this field for evidence chronology.
        tenant_id:
          type: string
        identity_assurance:
          type: object
          additionalProperties: false
          required: [authentication_method, cryptographically_verified, trust_domain_id]
          oneOf:
            - properties:
                authentication_method:
                  const: oidc
                cryptographically_verified:
                  const: true
                trust_domain_id:
                  pattern: "^sha256:[0-9a-f]{64}$"
            - properties:
                authentication_method:
                  const: local_demo_headers
                cryptographically_verified:
                  const: false
                trust_domain_id:
                  const: urn:parimit:identity-trust:local-demo-headers-v1
          properties:
            authentication_method:
              type: string
              enum: [oidc, local_demo_headers]
            cryptographically_verified:
              type: boolean
            trust_domain_id:
              type: string
          description: >-
            `cryptographically_verified` is true only for the OIDC mode. The
            trust-domain identifier binds the exact OIDC verifier configuration;
            local demo-header evidence uses the fixed lower-assurance URN.
        intent:
          type: object
          additionalProperties: false
          required: [snapshot, digest]
          properties:
            snapshot:
              type: object
              additionalProperties: false
              required:
                - version
                - id
                - tenant_id
                - idempotency_key
                - requested_by
                - on_behalf_of
                - amount
                - payee_reference
                - purpose
                - initial_status
                - policy
                - created_at
                - expires_at
              properties:
                version:
                  const: parimit-payment-intent-v3
                id:
                  type: string
                  format: uuid
                tenant_id:
                  type: string
                idempotency_key:
                  type: string
                requested_by:
                  type: object
                  additionalProperties: false
                  required: [type, id]
                  properties:
                    type:
                      const: agent
                    id:
                      type: string
                on_behalf_of:
                  type: [string, "null"]
                amount:
                  type: object
                  additionalProperties: false
                  required: [currency, minor]
                  properties:
                    currency:
                      const: INR
                    minor:
                      type: string
                payee_reference:
                  type: string
                purpose:
                  type: string
                  description: Signed plaintext; compact JWS provides integrity, not confidentiality.
                initial_status:
                  const: AWAITING_APPROVAL
                policy:
                  type: object
                  additionalProperties: false
                  required: [allowed, reasons, rules_version, config_digest, required_approvals]
                  properties:
                    allowed:
                      const: true
                    reasons:
                      type: array
                      items:
                        type: string
                    rules_version:
                      type: string
                    config_digest:
                      type: string
                      pattern: "^[0-9a-f]{64}$"
                    required_approvals:
                      type: integer
                      enum: [1, 2]
                created_at:
                  $ref: "#/components/schemas/CanonicalTimestamp"
                expires_at:
                  $ref: "#/components/schemas/CanonicalTimestamp"
            digest:
              $ref: "#/components/schemas/Sha256Digest"
        policy_digest:
          $ref: "#/components/schemas/Sha256Digest"
        decision:
          type: object
          additionalProperties: false
          required:
            - state
            - authorization_state_version
            - required_approvals
            - fully_approved_at
            - approval_set_digest
            - approvals
          properties:
            state:
              const: AUTHORIZED_NO_DISPATCH
            authorization_state_version:
              type: integer
              minimum: 2
            required_approvals:
              type: integer
              enum: [1, 2]
            fully_approved_at:
              $ref: "#/components/schemas/CanonicalTimestamp"
            approval_set_digest:
              $ref: "#/components/schemas/Sha256Digest"
            approvals:
              type: array
              minItems: 1
              maxItems: 2
              items:
                type: object
                additionalProperties: false
                required: [subject, role, decision, intent_hash, decided_at, record_digest]
                properties:
                  subject:
                    type: string
                  role:
                    type: string
                    enum: [approver, admin]
                  decision:
                    const: APPROVE
                  intent_hash:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                  decided_at:
                    $ref: "#/components/schemas/CanonicalTimestamp"
                  record_digest:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
        replay:
          type: object
          additionalProperties: false
          required: [nonce, use_limit]
          properties:
            nonce:
              type: string
              pattern: "^[A-Za-z0-9_-]{43}$"
            use_limit:
              const: 1
        source_audit:
          type: object
          additionalProperties: false
          required: [event_count, chain_tip]
          properties:
            event_count:
              type: integer
              minimum: 1
            chain_tip:
              type: string
              pattern: "^[0-9a-f]{64}$"
        capability:
          type: object
          additionalProperties: false
          required:
            - kind
            - payment_dispatch_authorized
            - execution_authorized
            - provider_instruction
            - moves_money
          properties:
            kind:
              const: EVIDENCE_ONLY
            payment_dispatch_authorized:
              const: false
            execution_authorized:
              const: false
            provider_instruction:
              const: false
            moves_money:
              const: false
        notice:
          type: string
    Sha256Digest:
      type: object
      additionalProperties: false
      required: [alg, value]
      properties:
        alg:
          const: sha-256
        value:
          type: string
          pattern: "^[0-9a-f]{64}$"
    EvidenceEnvelope:
      type: object
      additionalProperties: false
      required:
        - compact_jws
        - claims
        - signature
        - consumption
        - execution_authorized
        - moves_money
        - notice
      properties:
        compact_jws:
          type: string
        claims:
          $ref: "#/components/schemas/AuthorizationEnvelopeClaims"
        signature:
          type: object
          additionalProperties: false
          required: [algorithm, key_id, jwks_uri]
          properties:
            algorithm:
              const: EdDSA
            key_id:
              type: string
            jwks_uri:
              const: /.well-known/jwks.json
        consumption:
          $ref: "#/components/schemas/EvidenceEnvelopeConsumption"
        execution_authorized:
          const: false
        moves_money:
          const: false
        notice:
          type: string
        idempotent_replay:
          type: boolean
    EvidenceEnvelopeConsumption:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              const: UNCONSUMED
        - type: object
          additionalProperties: false
          required: [state, consumed_at, consumed_by]
          properties:
            state:
              const: CONSUMED
            consumed_at:
              $ref: "#/components/schemas/CanonicalTimestamp"
            consumed_by:
              type: string
              minLength: 1
              maxLength: 128
    EnvelopePublicJwk:
      type: object
      additionalProperties: false
      required: [kty, crv, x, use, key_ops, alg, kid]
      properties:
        kty:
          const: OKP
        crv:
          const: Ed25519
        x:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        use:
          const: sig
        key_ops:
          type: array
          minItems: 1
          maxItems: 1
          items:
            const: verify
        alg:
          const: EdDSA
        kid:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:@/+\\-]*$"
    EnvelopeJwks:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EnvelopePublicJwk"
    EvidenceEnvelopeVerification:
      type: object
      additionalProperties: false
      required:
        - valid
        - signature_valid
        - claims_valid
        - time_valid
        - locally_issued
        - intent_binding_valid
        - consumption
        - failures
      properties:
        valid:
          type: boolean
        signature_valid:
          type: boolean
        claims_valid:
          type: boolean
        time_valid:
          type: boolean
        locally_issued:
          type: boolean
        intent_binding_valid:
          type: boolean
        consumption:
          oneOf:
            - $ref: "#/components/schemas/EvidenceEnvelopeConsumption"
            - type: "null"
        failures:
          type: array
          items:
            type: string
        claims:
          $ref: "#/components/schemas/AuthorizationEnvelopeClaims"
    EvidenceEnvelopeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/EvidenceEnvelope"
        warning:
          type: string
          description: Present only when spoofable loopback demo headers authenticated the request.
    AuditEvent:
      type: object
      required: [sequence, intent_id, event_type, actor_id, payload, occurred_at, previous_hash, event_hash]
      properties:
        sequence:
          type: integer
          minimum: 1
        intent_id:
          type: string
        event_type:
          type: string
        actor_id:
          type: string
        payload: {}
        occurred_at:
          $ref: "#/components/schemas/CanonicalTimestamp"
        previous_hash:
          type: string
        event_hash:
          type: string
    IntegrityReport:
      type: object
      required: [valid, intent_hash_valid, approval_receipts_valid, audit_chain_valid, state_consistency_valid, failures]
      properties:
        valid:
          type: boolean
        intent_hash_valid:
          type: boolean
        approval_receipts_valid:
          type: boolean
        audit_chain_valid:
          type: boolean
        state_consistency_valid:
          type: boolean
          description: Whether policy, lifecycle state, approvals, observations, and audit evidence agree.
        failures:
          type: array
          items:
            type: string
    SafetyResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
    IntentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Intent"
    IntentResponseWithWarning:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Intent"
        warning:
          type: string
          description: Present for local demo authentication or mock-outcome safety notices.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
